# docker compose up -d --build   → http://<this machine's IP>:3000
# Settings come from .env (cp .env.example .env). Set PUBLIC_URL there to this machine's address.
services:
  vote:
    build: .
    image: contest-vote
    restart: unless-stopped
    init: true
    ports:
      # HOST_PORT in .env picks the port on this machine (default 3000); PUBLIC_URL must use the same one
      - "${HOST_PORT:-3000}:3000"
      # with HTTPS_PORT=3443 in .env, also publish it on the same number:
      # - "3443:3443"
    env_file:
      - path: .env
        required: false
    volumes:
      - vote-data:/data
    # run one instance only: data lives in the process's memory
volumes:
  vote-data:
